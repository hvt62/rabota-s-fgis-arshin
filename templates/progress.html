<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск в Аршине</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 20px;
            margin: 0 0 20px 0;
            color: #333;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #1976d2;
        }
        .stat-label {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        .stat-value.error { color: #d32f2f; }
        .stat-value.not-found { color: #f57c00; }
        .stat-value.success { color: #388e3c; }
        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1976d2, #42a5f5);
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .status-text {
            text-align: center;
            color: #666;
            font-size: 14px;
        }
        .hidden { display: none; }
        .btn {
            display: inline-block;
            background: #1976d2;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            margin-top: 20px;
        }
        .btn:hover { background: #1565c0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔍 Поиск в ФГИС «Аршин»</h1>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="total">0</div>
                <div class="stat-label">Всего записей</div>
            </div>
            <div class="stat">
                <div class="stat-value success" id="processed">0</div>
                <div class="stat-label">Обработано</div>
            </div>
            <div class="stat">
                <div class="stat-value error" id="errors">0</div>
                <div class="stat-label">Сбоев (500)</div>
            </div>
            <div class="stat">
                <div class="stat-value not-found" id="not_found">0</div>
                <div class="stat-label">Не найдено (200, 0 док.)</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status-text" id="statusText">Запуск обработки...</div>

        <div id="completeBlock" class="hidden" style="text-align:center;">
            <a class="btn" id="resultsLink" href="#">📊 Показать результаты</a>
        </div>
    </div>

    <script>
        const taskId = '{{ task_id }}';
        const pollInterval = 10000;

        function updateProgress() {
            fetch('/progress_data/' + taskId)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('total').textContent = data.total;
                    document.getElementById('processed').textContent = data.processed;
                    document.getElementById('errors').textContent = data.errors;
                    document.getElementById('not_found').textContent = data.not_found;

                    const pct = data.total > 0 ? Math.round((data.processed / data.total) * 100) : 0;
                    document.getElementById('progressFill').style.width = pct + '%';

                    if (data.status === 'running') {
                        document.getElementById('statusText').textContent =
                            `Обработано ${data.processed} из ${data.total} записей...`;
                        setTimeout(updateProgress, pollInterval);
                    } else if (data.status === 'complete') {
                        document.getElementById('statusText').textContent = '✅ Обработка завершена!';
                        document.getElementById('completeBlock').classList.remove('hidden');
                        document.getElementById('resultsLink').href = '/results/' + taskId;
                    }
                })
                .catch(() => {
                    setTimeout(updateProgress, pollInterval);
                });
        }

        updateProgress();
    </script>
</body>
</html>
