<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск во ФГИС «Аршин» — Прогресс</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: #e8ecf0;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a90d9, #357abd);
            border-radius: 6px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .progress-text {
            font-size: 28px;
            font-weight: 700;
            color: #4a90d9;
            margin-bottom: 8px;
        }
        .info {
            color: #666;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .info strong {
            color: #333;
        }
        .iteration-badge {
            display: inline-block;
            background: #e8f0fe;
            color: #4a90d9;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
            margin-top: 20px;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>🔍 Поиск данных</h1>
        <p class="subtitle">Выполняется поиск во ФГИС «Аршин»</p>

        <div class="iteration-badge" id="iterationBadge">Итерация 1/5</div>

        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>

        <div class="progress-text" id="progressPct">0%</div>
        <div class="info" id="currentInfo">Подготовка…</div>
        <div class="info">Всего номеров: <strong>{{ task.total }}</strong></div>

        <form method="post" action="/cancel/{{ task_id }}" id="cancelForm">
            <button type="submit" class="btn btn-danger">⏹ Отменить поиск</button>
        </form>
    </div>

    <script>
        const taskId = "{{ task_id }}";

        function updateProgress() {
            fetch("/progress_data/" + taskId)
                .then(r => r.json())
                .then(data => {
                    if (data.status === "complete") {
                        window.location.href = "/results/" + taskId;
                        return;
                    }
                    if (data.status === "cancelled") {
                        window.location.href = "/";
                        return;
                    }
                    if (data.status === "not_found") {
                        window.location.href = "/";
                        return;
                    }

                    document.getElementById("progressFill").style.width = data.progress_pct + "%";
                    document.getElementById("progressPct").textContent = Math.round(data.progress_pct) + "%";
                    document.getElementById("iterationBadge").textContent = "Итерация " + data.current_iteration + "/5";

                    if (data.current_number) {
                        document.getElementById("currentInfo").textContent = "Обрабатывается: " + data.current_number;
                    }

                    setTimeout(updateProgress, 2000);
                })
                .catch(() => {
                    setTimeout(updateProgress, 2000);
                });
        }

        updateProgress();
    </script>
</body>
</html>
