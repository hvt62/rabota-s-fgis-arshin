{% if total_pages > 1 %}
        <div class="pagination">
            <form method="post" action="/page/{{ task_id }}" style="display:inline" class="page-form">
                <input type="hidden" name="page" value="{{ page - 1 }}">
                <button type="submit" class="page-btn" {% if page <= 1 %}disabled{% endif %}>← Назад</button>
            </form>

            <span class="page-info">Страница {{ page }} из {{ total_pages }}</span>

            <form method="post" action="/page/{{ task_id }}" style="display:inline" class="page-form">
                <input type="hidden" name="page" value="{{ page + 1 }}">
                <button type="submit" class="page-btn" {% if page >= total_pages %}disabled{% endif %}>Вперёд →</button>
            </form>
        </div>
        {% endif %}
